<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenthora - Entertainment Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/Zenthora/assets/index-BuGSd12f.js"></script>
  <link rel="stylesheet" crossorigin href="/Zenthora/assets/index-DlSG3q2q.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://js.paystack.co/v2/inline.js"></script>


  <script>
  // Scroll reveal animation
  function revealOnScroll() {
    const reveals = document.querySelectorAll('.reveal');
    
    reveals.forEach(element => {
      const windowHeight = window.innerHeight;
      const elementTop = element.getBoundingClientRect().top;
      const revealPoint = 100;
      
      if (elementTop < windowHeight - revealPoint) {
        element.classList.add('active');
      }
    });
  }

  // Add 'reveal' class to sections and cards
  document.addEventListener('DOMContentLoaded', function() {
    // Add reveal to product cards
    document.querySelectorAll('.product-card').forEach(card => {
      card.classList.add('reveal');
    });
    
    // Add reveal to sections
    document.querySelectorAll('.section').forEach(section => {
      section.classList.add('reveal');
    });
    
    // Add reveal to cart items
    document.querySelectorAll('.cart-item-modern').forEach(item => {
      item.classList.add('reveal');
    });
    
    // Add reveal to category grid items
    document.querySelectorAll('.cat-grid > *').forEach(item => {
      item.classList.add('reveal');
    });
    
    // Add reveal to hero
    const hero = document.querySelector('.hero');
    if (hero) hero.classList.add('reveal', 'active');
    
    // Initial check
    revealOnScroll();
  });

  window.addEventListener('scroll', revealOnScroll);
</script>


</body>
</html>
